<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#243a52"><title>熟語のしずく</title><link rel="stylesheet" href="css/style.css"></head><body><main>
<section id="home" class="screen active"><div class="panel home"><div class="home-hero"><div class="home-copy"><p class="eyebrow">小学6年 国語｜熟語の成り立ち</p><h1>熟語のしずく</h1><p class="lead">熟語を分けて、意味の関係を見抜こう。</p></div><img class="navi-character home-navi" src="https://tt-sensei.github.io/navi-character-/assets/web/groups/learning/group-learning-pair-diagram.webp" alt="二人組③・図で考え方を説明"></div><button id="continue" class="primary">レベルを選ぶ</button><button id="trainHome" class="secondary" hidden>ミスした熟語を特訓</button><div id="record" class="record"></div><details><summary>学び方</summary><p>二字熟語は4つの関係、三字熟語は3つのつくり、四字以上は2つのまとまりに仕分けます。正解後は、熟語のつくりと言い換えも確認しましょう。</p></details></div></section>
<section id="levels" class="screen"><div class="panel wide"><header class="page-head"><div><p class="eyebrow">LEVEL SELECT</p><h2>レベルを選ぶ</h2></div><button class="small toHome">ホーム</button></header><div id="levelGrid" class="level-grid"></div></div></section>
<section id="game" class="screen game"><header class="hud"><div class="brand"><b>熟語のしずく</b><small id="levelName"></small></div><div><small>問題</small><b id="progress"></b></div><div><small>正解</small><b id="correct">0</b></div><div><small>コンボ</small><b id="combo">0</b></div><div><small>ミス</small><b id="miss">0 / 4</b></div><button id="full" class="round" aria-label="全画面">⛶</button><button id="pause" class="round" aria-label="一時停止">Ⅱ</button></header><div id="field" class="field"><div class="quiet-rain" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><span id="prompt" class="prompt"></span><span class="rotate">横向きがおすすめ</span><div id="dropLine" class="drop-line"><span>仕分けライン</span></div><article id="wordCard" class="word-card"><span id="word"></span></article><div id="staticQuestion" class="static-question" hidden><div id="staticWord" class="static-word"></div><div id="stepBadge" class="step-badge"></div></div><div id="feedback" class="feedback" role="status"></div><div id="missStack" class="miss-stack"></div></div><div id="choices" class="choices"></div></section>
<section id="result" class="screen"><div class="panel"><p class="eyebrow">今回の結果</p><h2 id="resultTitle">よく考えました！</h2><div class="result-main"><span>正解</span><b id="rCorrect"></b><span>最高コンボ</span><b id="rCombo"></b></div><div id="rDetail"></div><button id="again" class="primary">同じレベルにもう一度</button><button id="resultTrain" class="secondary">ミスした熟語を特訓</button><button id="toLevels" class="secondary">レベル選択</button><button class="text toHome">ホーム</button></div></section>
<section id="training" class="screen"><div class="panel"><p class="eyebrow">まちがい直し</p><h2>特訓モード</h2><p>落下しません。区切りや関係をゆっくり考えます。</p><div id="tProgress" class="progress"></div><div id="tWord" class="training-word"></div><div id="tPrompt" class="training-prompt"></div><div id="tChoices" class="training-choices"></div><div id="tFeedback" class="training-feedback"></div><button id="tNext" class="primary" hidden>次へ</button><button class="text toHome">ホーム</button></div></section>
</main><div id="modal" class="modal" hidden><div><h2>一時停止</h2><p>考える時間は大切です。</p><button id="resume" class="primary">つづける</button><button class="text toHome">ホーム</button></div></div>
<script src="js/data/category-data.js"></script><script src="js/data/level-data.js"></script><script src="js/data/jukugo-data.js"></script><script src="js/storage/storage.js"></script><script src="js/game/falling-word.js"></script><script src="js/game/game.js"></script><script src="js/app.js"></script></body></html>
